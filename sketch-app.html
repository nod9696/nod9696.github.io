<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sketchpad">
<title>Sketchpad</title>
<style>
  :root{
    --paper:#f6f3ec;
    --ink:#2b2622;
    --graphite:#5c5650;
    --accent:#c1502e;
    --line:#d8d2c4;
    --tool-bg:#fffdf8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--paper);
    font-family:'Courier New', ui-monospace, monospace;
    color:var(--ink);
    overflow:hidden;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  header{
    display:flex;
    align-items:baseline;
    gap:12px;
    padding:14px 20px 10px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  header .title{
    font-size:15px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    font-weight:700;
  }
  header .sub{
    font-size:11px;
    color:var(--graphite);
    letter-spacing:0.04em;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:18px;
    padding:10px 20px;
    background:var(--tool-bg);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .group{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .group-label{
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--graphite);
    text-transform:uppercase;
    margin-right:2px;
  }
  button{
    font-family:inherit;
    border:1px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
    letter-spacing:0.03em;
    transition:background .12s, color .12s;
  }
  button:hover{ background:var(--ink); color:var(--paper); }
  button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled{ opacity:0.35; cursor:default; }
  button:disabled:hover{ background:var(--paper); color:var(--ink); }
  .swatch{
    width:22px; height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    cursor:pointer;
    padding:0;
  }
  .swatch.selected{
    outline:2px solid var(--ink);
    outline-offset:2px;
  }
  input[type=color]{
    width:26px; height:26px;
    border:1px solid var(--ink);
    padding:0;
    background:none;
    cursor:pointer;
  }
  input[type=range]{
    width:90px;
    accent-color:var(--accent);
  }
  .size-label{
    font-size:11px;
    color:var(--graphite);
    width:26px;
  }
  @media (orientation: landscape) {
    header{ display:none; }
    .toolbar{ padding:6px 14px; gap:12px; }
  }
  main{
    flex:1;
    position:relative;
    overflow:hidden;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, #00000006 28px);
  }
  canvas{
    position:absolute;
    top:0; left:0;
    cursor:crosshair;
    touch-action:none;
  }
  .layers-panel{
    position:absolute;
    top:12px;
    right:12px;
    width:210px;
    max-height:calc(100% - 24px);
    overflow-y:auto;
    background:var(--tool-bg);
    border:1px solid var(--ink);
    box-shadow:2px 2px 0 rgba(0,0,0,0.08);
    padding:10px;
    z-index:20;
    display:none;
  }
  .layers-panel.open{ display:block; }
  .layers-panel h3{
    margin:0 0 8px;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--graphite);
  }
  .layer-row{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:6px 4px;
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  .layer-row.active{ background:#f0ead9; }
  .layer-row-top{
    display:flex;
    align-items:center;
    gap:5px;
  }
  .layer-row .layer-name{
    flex:1;
    cursor:pointer;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .layer-row button{
    padding:2px 6px;
    font-size:11px;
  }
  .layer-row input[type=checkbox]{
    cursor:pointer;
    accent-color:var(--accent);
  }
  .layer-row-bottom{
    display:flex;
    align-items:center;
    gap:6px;
    padding-left:22px;
  }
  .layer-row-bottom input[type=range]{
    flex:1;
    width:auto;
  }
  .opacity-label{
    font-size:10px;
    color:var(--graphite);
    white-space:nowrap;
  }
  .opacity-value{
    font-size:10px;
    color:var(--graphite);
    width:32px;
    text-align:right;
  }
  .add-layer-btn{
    width:100%;
    margin-top:8px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">Sketchpad</div>
    <div class="sub">quick sketch tool</div>
  </header>

  <div class="toolbar">
    <div class="group">
      <span class="group-label">Brush</span>
      <button id="penBtn" class="active" data-brush="pen">ペン</button>
      <button id="gpenBtn" data-brush="gpen">Gペン</button>
      <button id="pencilBtn" data-brush="pencil">鉛筆</button>
      <button id="markerBtn" data-brush="marker">マーカー</button>
      <button id="brushBtn" data-brush="brush">筆</button>
      <button id="eraserBtn" data-brush="eraser">消しゴム</button>
    </div>

    <div class="group">
      <span class="group-label">Color</span>
      <button class="swatch selected" data-color="#2b2622" style="background:#2b2622"></button>
      <button class="swatch" data-color="#c1502e" style="background:#c1502e"></button>
      <button class="swatch" data-color="#3a6b5c" style="background:#3a6b5c"></button>
      <button class="swatch" data-color="#3b5b8c" style="background:#3b5b8c"></button>
      <input type="color" id="colorPicker" value="#2b2622">
    </div>

    <div class="group">
      <span class="group-label">Size</span>
      <input type="range" id="sizeSlider" min="1" max="40" value="4">
      <span class="size-label" id="sizeLabel">4px</span>
    </div>

    <div class="group">
      <button id="undoBtn" disabled>元に戻す</button>
      <button id="redoBtn" disabled>やり直し</button>
      <button id="clearBtn">レイヤー消去</button>
    </div>

    <div class="group">
      <button id="layersBtn">レイヤー</button>
      <button id="loadImageBtn">画像を読み込む</button>
      <input type="file" id="imageInput" accept="image/*" style="display:none">
      <button id="saveBtn">画像保存</button>
      <button id="landscapeBtn">横画面モード</button>
    </div>
  </div>

  <main>
    <canvas id="canvas"></canvas>
    <div class="layers-panel" id="layersPanel">
      <h3>Layers</h3>
      <div id="layerList"></div>
      <button class="add-layer-btn" id="addLayerBtn">＋ 新規レイヤー</button>
    </div>
  </main>
</div>

<script>
const displayCanvas = document.getElementById('canvas');
const displayCtx = displayCanvas.getContext('2d');
const main = document.querySelector('main');

let drawing = false;
let brush = 'pen'; // pen | gpen | pencil | marker | brush | eraser
let color = '#2b2622';
let penSize = 4;
let eraserSize = 20;
let lastX = 0, lastY = 0;

function currentSize() {
  return brush === 'eraser' ? eraserSize : penSize;
}

// ---------- Layers ----------
let layers = []; // { id, name, canvas, ctx, visible }
let activeLayerIndex = 0;
let layerCounter = 0;
let belowCache = null;
let aboveCache = null;

function makeLayerCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w || 1);
  c.height = Math.max(1, h || 1);
  return c;
}

function addLayer(name) {
  layerCounter++;
  const c = makeLayerCanvas(displayCanvas.width, displayCanvas.height);
  const layerCtx = c.getContext('2d');
  layerCtx.lineCap = 'round';
  layerCtx.lineJoin = 'round';
  return { id: layerCounter, name: name || ('レイヤー' + layerCounter), canvas: c, ctx: layerCtx, visible: true, opacity: 1 };
}

function compositeAll() {
  displayCtx.setTransform(1, 0, 0, 1, 0, 0);
  displayCtx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);
  displayCtx.fillStyle = '#fffdf8';
  displayCtx.fillRect(0, 0, displayCanvas.width, displayCanvas.height);
  layers.forEach(layer => {
    if (!layer.visible) return;
    displayCtx.globalAlpha = layer.opacity;
    displayCtx.drawImage(layer.canvas, 0, 0);
  });
  displayCtx.globalAlpha = 1;
}

function buildStrokeCaches() {
  const w = displayCanvas.width, h = displayCanvas.height;
  belowCache = makeLayerCanvas(w, h);
  const bctx = belowCache.getContext('2d');
  bctx.fillStyle = '#fffdf8';
  bctx.fillRect(0, 0, w, h);
  for (let i = 0; i < activeLayerIndex; i++) {
    if (layers[i].visible) {
      bctx.globalAlpha = layers[i].opacity;
      bctx.drawImage(layers[i].canvas, 0, 0);
    }
  }
  bctx.globalAlpha = 1;
  aboveCache = makeLayerCanvas(w, h);
  const actx = aboveCache.getContext('2d');
  for (let i = activeLayerIndex + 1; i < layers.length; i++) {
    if (layers[i].visible) {
      actx.globalAlpha = layers[i].opacity;
      actx.drawImage(layers[i].canvas, 0, 0);
    }
  }
  actx.globalAlpha = 1;
}

function quickComposite() {
  displayCtx.setTransform(1, 0, 0, 1, 0, 0);
  displayCtx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);
  if (belowCache) displayCtx.drawImage(belowCache, 0, 0);
  const active = layers[activeLayerIndex];
  if (active && active.visible) {
    displayCtx.globalAlpha = active.opacity;
    displayCtx.drawImage(active.canvas, 0, 0);
    displayCtx.globalAlpha = 1;
  }
  if (aboveCache) displayCtx.drawImage(aboveCache, 0, 0);
}

function renderLayerPanel() {
  const list = document.getElementById('layerList');
  list.innerHTML = '';
  for (let i = layers.length - 1; i >= 0; i--) {
    const layer = layers[i];
    const row = document.createElement('div');
    row.className = 'layer-row' + (i === activeLayerIndex ? ' active' : '');

    const topRow = document.createElement('div');
    topRow.className = 'layer-row-top';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = layer.visible;
    checkbox.addEventListener('change', () => {
      layer.visible = checkbox.checked;
      compositeAll();
    });

    const nameSpan = document.createElement('span');
    nameSpan.className = 'layer-name';
    nameSpan.textContent = layer.name;
    nameSpan.addEventListener('click', () => {
      activeLayerIndex = i;
      renderLayerPanel();
    });

    const upBtn = document.createElement('button');
    upBtn.textContent = '↑';
    upBtn.disabled = i === layers.length - 1;
    upBtn.addEventListener('click', (ev) => { ev.stopPropagation(); moveLayer(i, 1); });

    const downBtn = document.createElement('button');
    downBtn.textContent = '↓';
    downBtn.disabled = i === 0;
    downBtn.addEventListener('click', (ev) => { ev.stopPropagation(); moveLayer(i, -1); });

    const delBtn = document.createElement('button');
    delBtn.textContent = '削除';
    delBtn.disabled = layers.length <= 1;
    delBtn.addEventListener('click', (ev) => { ev.stopPropagation(); deleteLayer(i); });

    topRow.appendChild(checkbox);
    topRow.appendChild(nameSpan);
    topRow.appendChild(upBtn);
    topRow.appendChild(downBtn);
    topRow.appendChild(delBtn);

    const bottomRow = document.createElement('div');
    bottomRow.className = 'layer-row-bottom';

    const opacityLabel = document.createElement('span');
    opacityLabel.className = 'opacity-label';
    opacityLabel.textContent = '不透明度';

    const opacitySlider = document.createElement('input');
    opacitySlider.type = 'range';
    opacitySlider.min = 0;
    opacitySlider.max = 100;
    opacitySlider.value = Math.round(layer.opacity * 100);

    const opacityValue = document.createElement('span');
    opacityValue.className = 'opacity-value';
    opacityValue.textContent = Math.round(layer.opacity * 100) + '%';

    opacitySlider.addEventListener('input', (ev) => {
      const v = parseInt(ev.target.value, 10);
      layer.opacity = v / 100;
      opacityValue.textContent = v + '%';
      compositeAll();
    });

    bottomRow.appendChild(opacityLabel);
    bottomRow.appendChild(opacitySlider);
    bottomRow.appendChild(opacityValue);

    row.appendChild(topRow);
    row.appendChild(bottomRow);
    list.appendChild(row);
  }
}

function moveLayer(index, dir) {
  const newIndex = index + dir;
  if (newIndex < 0 || newIndex >= layers.length) return;
  const tmp = layers[index];
  layers[index] = layers[newIndex];
  layers[newIndex] = tmp;
  if (activeLayerIndex === index) activeLayerIndex = newIndex;
  else if (activeLayerIndex === newIndex) activeLayerIndex = index;
  compositeAll();
  renderLayerPanel();
}

function deleteLayer(index) {
  if (layers.length <= 1) return;
  layers.splice(index, 1);
  if (activeLayerIndex >= layers.length) activeLayerIndex = layers.length - 1;
  else if (activeLayerIndex > index) activeLayerIndex--;
  undoStack = [];
  redoStack = [];
  updateHistoryButtons();
  compositeAll();
  renderLayerPanel();
}

document.getElementById('addLayerBtn').addEventListener('click', () => {
  const layer = addLayer();
  layers.push(layer);
  activeLayerIndex = layers.length - 1;
  compositeAll();
  renderLayerPanel();
});

function placeImageOnNewLayer(source, srcWidth, srcHeight) {
  const layer = addLayer('画像');
  const w = displayCanvas.width, h = displayCanvas.height;
  const scale = Math.min(w / srcWidth, h / srcHeight);
  const dw = srcWidth * scale;
  const dh = srcHeight * scale;
  const dx = (w - dw) / 2;
  const dy = (h - dh) / 2;
  layer.ctx.drawImage(source, dx, dy, dw, dh);
  layers.push(layer);
  activeLayerIndex = layers.length - 1;
  compositeAll();
  renderLayerPanel();
}

function loadImageFileViaFileReader(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    let settled = false;
    const timeoutId = setTimeout(() => {
      if (settled) return;
      settled = true;
      alert('画像の読み込みがタイムアウトしました。このプレビュー画面の制限が原因の可能性があります。ファイルをSafariなど通常のブラウザタブで開いてお試しください。');
    }, 6000);
    img.onload = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      placeImageOnNewLayer(img, img.width, img.height);
    };
    img.onerror = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      alert('画像の読み込みに失敗しました。別の画像でお試しください。');
    };
    img.src = e.target.result;
  };
  reader.onerror = () => alert('ファイルの読み込みに失敗しました。');
  reader.readAsDataURL(file);
}

async function loadImageFile(file) {
  // Prefer createImageBitmap: it decodes the file directly with no URL involved,
  // which avoids blob:/data: restrictions some sandboxed preview environments impose.
  if (window.createImageBitmap) {
    try {
      const bitmap = await createImageBitmap(file);
      placeImageOnNewLayer(bitmap, bitmap.width, bitmap.height);
      return;
    } catch (err) {
      // fall through to FileReader-based approach below
    }
  }
  loadImageFileViaFileReader(file);
}

document.getElementById('loadImageBtn').addEventListener('click', () => {
  document.getElementById('imageInput').click();
});

document.getElementById('imageInput').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (file) loadImageFile(file);
  e.target.value = '';
});

const layersPanel = document.getElementById('layersPanel');
document.getElementById('layersBtn').addEventListener('click', () => {
  layersPanel.classList.toggle('open');
  document.getElementById('layersBtn').classList.toggle('active', layersPanel.classList.contains('open'));
});

// ---------- History ----------
let undoStack = [];
let redoStack = [];
const MAX_HISTORY = 30;

function saveState() {
  const layer = layers[activeLayerIndex];
  undoStack.push({ layer, imageData: layer.ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height) });
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
  updateHistoryButtons();
}

function updateHistoryButtons() {
  document.getElementById('undoBtn').disabled = undoStack.length === 0;
  document.getElementById('redoBtn').disabled = redoStack.length === 0;
}

// ---------- Canvas sizing ----------
function resizeCanvas(preserve) {
  const rect = main.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const newW = Math.max(1, Math.round(rect.width * dpr));
  const newH = Math.max(1, Math.round(rect.height * dpr));

  layers.forEach(layer => {
    let prevData = null;
    if (preserve && layer.canvas.width > 0 && layer.canvas.height > 0) {
      prevData = layer.ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height);
    }
    layer.canvas.width = newW;
    layer.canvas.height = newH;
    if (prevData) layer.ctx.putImageData(prevData, 0, 0);
    layer.ctx.lineCap = 'round';
    layer.ctx.lineJoin = 'round';
  });

  displayCanvas.width = newW;
  displayCanvas.height = newH;
  displayCanvas.style.width = rect.width + 'px';
  displayCanvas.style.height = rect.height + 'px';
  compositeAll();
}

window.addEventListener('resize', () => resizeCanvas(true));

// ---------- Drawing ----------
function getPos(e) {
  const rect = displayCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * dpr,
    y: (clientY - rect.top) * dpr
  };
}

function drawStroke(targetCtx, x0, y0, x1, y1, dist) {
  const dpr = window.devicePixelRatio || 1;
  const baseWidth = currentSize() * dpr;
  targetCtx.lineCap = 'round';
  targetCtx.lineJoin = 'round';
  targetCtx.globalCompositeOperation = 'source-over';
  targetCtx.globalAlpha = 1;

  if (brush === 'eraser') {
    targetCtx.globalCompositeOperation = 'destination-out';
    targetCtx.strokeStyle = 'rgba(0,0,0,1)';
    targetCtx.lineWidth = baseWidth;
    targetCtx.beginPath(); targetCtx.moveTo(x0, y0); targetCtx.lineTo(x1, y1); targetCtx.stroke();
    targetCtx.globalCompositeOperation = 'source-over';
    return;
  }

  if (brush === 'pen') {
    targetCtx.strokeStyle = color;
    targetCtx.lineWidth = baseWidth;
    targetCtx.beginPath(); targetCtx.moveTo(x0, y0); targetCtx.lineTo(x1, y1); targetCtx.stroke();
    return;
  }

  if (brush === 'gpen') {
    const speedFactor = Math.max(0.12, 1 - Math.min(dist, 30) / 30);
    const w = baseWidth * (0.25 + speedFactor * 1.6);
    targetCtx.strokeStyle = color;
    targetCtx.globalAlpha = 1;
    targetCtx.lineWidth = Math.max(0.6, w);
    targetCtx.lineCap = 'round';
    targetCtx.beginPath(); targetCtx.moveTo(x0, y0); targetCtx.lineTo(x1, y1); targetCtx.stroke();
    return;
  }

  if (brush === 'pencil') {
    const steps = Math.max(1, Math.floor(dist / 2));
    targetCtx.fillStyle = color;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const jx = x0 + (x1 - x0) * t + (Math.random() - 0.5) * baseWidth * 0.6;
      const jy = y0 + (y1 - y0) * t + (Math.random() - 0.5) * baseWidth * 0.6;
      targetCtx.globalAlpha = 0.15 + Math.random() * 0.35;
      const r = Math.max(0.5, (baseWidth * 0.35) * (0.5 + Math.random() * 0.5));
      targetCtx.beginPath(); targetCtx.arc(jx, jy, r, 0, Math.PI * 2); targetCtx.fill();
    }
    targetCtx.globalAlpha = 1;
    return;
  }

  if (brush === 'marker') {
    targetCtx.globalCompositeOperation = 'multiply';
    targetCtx.globalAlpha = 0.45;
    targetCtx.strokeStyle = color;
    targetCtx.lineWidth = baseWidth * 1.8;
    targetCtx.lineCap = 'square';
    targetCtx.beginPath(); targetCtx.moveTo(x0, y0); targetCtx.lineTo(x1, y1); targetCtx.stroke();
    targetCtx.globalCompositeOperation = 'source-over';
    targetCtx.globalAlpha = 1;
    return;
  }

  if (brush === 'brush') {
    const speedFactor = Math.max(0.3, 1 - Math.min(dist, 40) / 40);
    const w = baseWidth * (0.5 + speedFactor * 1.2);
    targetCtx.strokeStyle = color;
    targetCtx.globalAlpha = 0.5;
    targetCtx.lineWidth = w;
    targetCtx.beginPath(); targetCtx.moveTo(x0, y0); targetCtx.lineTo(x1, y1); targetCtx.stroke();
    targetCtx.globalAlpha = 0.25;
    targetCtx.lineWidth = w * 1.5;
    targetCtx.beginPath(); targetCtx.moveTo(x0, y0); targetCtx.lineTo(x1, y1); targetCtx.stroke();
    targetCtx.globalAlpha = 1;
    return;
  }
}

function startDraw(e) {
  e.preventDefault();
  saveState();
  drawing = true;
  buildStrokeCaches();
  const pos = getPos(e);
  lastX = pos.x;
  lastY = pos.y;
  const activeCtx = layers[activeLayerIndex].ctx;
  drawStroke(activeCtx, pos.x, pos.y, pos.x + 0.01, pos.y + 0.01, 0);
  quickComposite();
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();
  const pos = getPos(e);
  const dist = Math.hypot(pos.x - lastX, pos.y - lastY);
  const activeCtx = layers[activeLayerIndex].ctx;
  drawStroke(activeCtx, lastX, lastY, pos.x, pos.y, dist);
  quickComposite();
  lastX = pos.x;
  lastY = pos.y;
}

function endDraw() {
  drawing = false;
}

displayCanvas.addEventListener('mousedown', startDraw);
displayCanvas.addEventListener('mousemove', draw);
window.addEventListener('mouseup', endDraw);

displayCanvas.addEventListener('touchstart', startDraw, {passive:false});
displayCanvas.addEventListener('touchmove', draw, {passive:false});
displayCanvas.addEventListener('touchend', endDraw);

// ---------- Toolbar wiring ----------
const sizeSlider = document.getElementById('sizeSlider');
const sizeLabel = document.getElementById('sizeLabel');

function syncSizeUI() {
  if (brush === 'eraser') {
    sizeSlider.max = 80;
    sizeSlider.value = eraserSize;
    sizeLabel.textContent = eraserSize + 'px';
  } else {
    sizeSlider.max = 40;
    sizeSlider.value = penSize;
    sizeLabel.textContent = penSize + 'px';
  }
}

const brushButtons = document.querySelectorAll('[data-brush]');
brushButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    brush = btn.dataset.brush;
    brushButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    syncSizeUI();
  });
});
syncSizeUI();

document.querySelectorAll('.swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    color = sw.dataset.color;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    sw.classList.add('selected');
    document.getElementById('colorPicker').value = color;
    if (brush === 'eraser') {
      brush = 'pen';
      brushButtons.forEach(b => b.classList.remove('active'));
      document.getElementById('penBtn').classList.add('active');
      syncSizeUI();
    }
  });
});

document.getElementById('colorPicker').addEventListener('input', (e) => {
  color = e.target.value;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
  if (brush === 'eraser') {
    brush = 'pen';
    brushButtons.forEach(b => b.classList.remove('active'));
    document.getElementById('penBtn').classList.add('active');
    syncSizeUI();
  }
});

sizeSlider.addEventListener('input', (e) => {
  const v = parseInt(e.target.value, 10);
  if (brush === 'eraser') {
    eraserSize = v;
  } else {
    penSize = v;
  }
  sizeLabel.textContent = v + 'px';
});

document.getElementById('undoBtn').addEventListener('click', () => {
  if (undoStack.length === 0) return;
  const entry = undoStack.pop();
  redoStack.push({ layer: entry.layer, imageData: entry.layer.ctx.getImageData(0, 0, entry.layer.canvas.width, entry.layer.canvas.height) });
  entry.layer.ctx.putImageData(entry.imageData, 0, 0);
  compositeAll();
  updateHistoryButtons();
});

document.getElementById('redoBtn').addEventListener('click', () => {
  if (redoStack.length === 0) return;
  const entry = redoStack.pop();
  undoStack.push({ layer: entry.layer, imageData: entry.layer.ctx.getImageData(0, 0, entry.layer.canvas.width, entry.layer.canvas.height) });
  entry.layer.ctx.putImageData(entry.imageData, 0, 0);
  compositeAll();
  updateHistoryButtons();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  saveState();
  const layer = layers[activeLayerIndex];
  layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
  compositeAll();
});

document.getElementById('saveBtn').addEventListener('click', () => {
  displayCanvas.toBlob(async (blob) => {
    if (!blob) return;

    const file = new File([blob], 'sketch.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Sketch' });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }

    // Fallback for browsers that support direct downloads (desktop / Android Chrome)
    const link = document.createElement('a');
    link.download = 'sketch.png';
    link.href = displayCanvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }, 'image/png');
});

const landscapeBtn = document.getElementById('landscapeBtn');
landscapeBtn.addEventListener('click', async () => {
  if (!document.fullscreenElement) {
    try {
      await document.documentElement.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) {
        try {
          await screen.orientation.lock('landscape');
        } catch (err) {
          // orientation lock not supported/allowed on this device
        }
      }
      landscapeBtn.classList.add('active');
    } catch (err) {
      alert('この端末・ブラウザでは自動回転に対応していません。端末を横向きにしてください。');
    }
  } else {
    document.exitFullscreen();
    if (screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock();
    }
    landscapeBtn.classList.remove('active');
  }
});

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    landscapeBtn.classList.remove('active');
  }
  resizeCanvas(true);
});

// ---------- Init ----------
const firstLayer = addLayer('レイヤー1');
layers.push(firstLayer);
activeLayerIndex = 0;
resizeCanvas(false);
renderLayerPanel();
</script>
</body>
</html>
